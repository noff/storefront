# Name of your application. Used to uniquely configure containers.
service: storefront

# Name of the container image.
image: storefront

# Deploy to these servers.
servers:
  web:
    - 194.104.230.90

# Proxy configuration. SSL is handled externally by nginx + certbot.
proxy:
  host: storefront.mkechinov.ru
  ssl: false
  app_port: 80
  run:
    # Shared host proxy (also serves the "daily" app) is bound to 8009.
    http_port: 8009
    https_port: 8443
    bind_ips:
      - 127.0.0.1

# Local Docker registry: Kamal runs registry:3 on the dev machine and
# reverse-forwards this port to the server during push/pull.
# Port 5556, because 5555 is already taken on the server.
registry:
  server: localhost:5556

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent storage: SQLite databases and Active Storage files on the host.
volumes:
  - "/home/daily/storefront/storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404 on in-flight requests.
asset_path: /rails/public/assets

# Build on the server via SSH (native amd64, no QEMU emulation).
builder:
  arch: amd64
  remote: ssh://daily@194.104.230.90:21212

# SSH user
ssh:
  user: daily
  port: 21212